name: Renovate

# Self-hosted Renovate: keeps this app on the latest keel tag.
# Runs on a daily schedule and on demand. Opens (and auto-merges, once CI is
# green) a single "keel" PR whenever keel publishes a newer tag — bumping both
# the requirements.txt pin and the reusable-workflow pin in ci.yml.
#
# Requires a repo secret RENOVATE_TOKEN: a PAT with Contents + Pull-requests +
# Workflows write. The Workflows scope is required because the keel bump edits
# .github/workflows/ci.yml. A separate token (not the default GITHUB_TOKEN) is
# mandatory so the bump PR triggers this repo's CI — PRs opened by GITHUB_TOKEN
# do not fire `on: pull_request` workflows, which would defeat the safety gate.

on:
  schedule:
    # Twice weekly (Mon & Thu 06:00 UTC). Renovate merges its own PRs (platformAutomerge is off on free
    # private repos), so merge latency = run frequency: a keel bump merges within
    # ~6h of its CI going green. Use workflow_dispatch for an immediate cycle.
    - cron: "0 6 * * 1,4"
  workflow_dispatch:
    inputs:
      dryRun:
        description: "Dry run (log only, open no PRs)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - name: Run Renovate
        uses: renovatebot/github-action@v46.1.16
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_DRY_RUN: ${{ inputs.dryRun && 'full' || 'null' }}
          LOG_LEVEL: ${{ inputs.dryRun && 'debug' || 'info' }}
